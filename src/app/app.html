<div class="site-shell">
  <header class="topbar">
    <a class="brand" routerLink="/">PO Vision</a>
    <nav class="topbar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
    <a class="button button-primary" routerLink="/contact">Request a Call</a>
  </header>

  <main class="content-shell">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div>
      <strong>PO Vision</strong>
      <p>Powering product leadership with clear strategy, elegant design, and adaptive delivery.</p>
    </div>
    <div class="footer-links">
      <a routerLink="/">Home</a>
      <a routerLink="/about">About</a>
      <a routerLink="/services">Services</a>
      <a routerLink="/contact">Contact</a>
    </div>
  </footer>
</div>
